services:
  - type: web
    name: senda-suds-backend
    env: python
    rootDir: senda-suds/senda-suds            # <- un nivel arriba de api
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn api.app:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # p. ej. sqlite:////var/tmp/ecommerce.db
      - key: JWT_SECRET_KEY
        sync: false        # genera un secreto
      - key: CORS_ORIGINS
        sync: false        # p. ej. https://TU-FRONT.onrender.com

  - type: web
    name: senda-suds-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # p. ej. https://TU-BACK.onrender.com/api
